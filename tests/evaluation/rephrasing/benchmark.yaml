# تِبْيان — Rephrasing benchmark (retrieval only, evaluation data — never loaded by production code).
#
# 50 fatwas from the indexed corpus (data/corpus/binbaz), chosen across all 13 categories roughly in
# proportion to their size, and NOT used in data/eval/semantic_questions.yaml or semantic_hard_cases.yaml.
# Each item yields 8 variants:
#   original   — the asker's question, read verbatim from the source snapshot at run time (not copied here)
#   formal     — Modern Standard Arabic, different wording
#   colloquial — natural Saudi dialect
#   short      — a few words
#   indirect   — describes the situation without naming the ruling
#   synonym    — key terms replaced by synonyms
#   typo       — a simple spelling mistake (ه/ة، ا/أ، dropped letter …)
#   english    — English
# Written by hand (no generator, no LLM at run time); meaning preserved, wording deliberately changed.
# `id` is the expected fatwa; `also` lists fatwas in the corpus that answer the SAME issue (near-duplicates),
# counted as correct for the lenient metric. `topic` is the expected topic (the fatwa title).
# Needs review by the governance lead before any public claim.

items:
  # ── صلاة المسافر ──
  - id: "4810"
    topic: مسافة قصر الصلاة
    also: ["5021", "5019", "4982"]
    formal: كم يبلغ مقدار السفر الذي تُختصر فيه الصلاة الرباعية؟
    colloquial: كم كيلو لازم أمشي عشان أقدر أقصر الصلاة؟
    short: مسافة القصر؟
    indirect: بطلع لمدينة تبعد عني سبعين كيلو، هل هذي تعتبر سفر أصلي فيه ركعتين؟
    synonym: ما مقدار الطريق الذي يُباح معه اختصار الصلاة للمرتحل؟
    typo: ماهي المسافه اللي يجوز فيها قصر الصلاه
    english: How far must I travel before I can shorten my prayers?
  - id: "4298"
    topic: كيفية الصلاة في الطائرة
    formal: ما الصفة المشروعة لأداء الفريضة على متن الطائرة؟
    colloquial: وأنا راكب الطيارة كيف أصلي؟
    short: الصلاة في الطيارة؟
    indirect: رحلتي طويلة وبيدخل وقت الصلاة وحنا في الجو، أصلي على الكرسي ولا كيف؟
    synonym: كيف يؤدي الراكب صلاته وهو في الرحلة الجوية؟
    typo: كيف اصلي في الطايره
    english: How do I pray on a plane?
  - id: "3136"
    topic: القصر والفطر للسائق الدائم السفر
    also: ["5022", "4462"]
    formal: هل يترخص من يعمل سائقًا متنقلًا على الدوام بقصر الصلاة والفطر في رمضان؟
    colloquial: أنا سواق شاحنة وأغلب وقتي بالطرق، أقصر وأفطر برمضان ولا لا؟
    short: السائق الدائم السفر يقصر ويفطر؟
    indirect: شغلي توصيل بضائع بين المدن طول السنة، هل لي رخص المسافر؟
    synonym: هل لقائد المركبة الذي يتنقل باستمرار أن يختصر الصلاة ويترك الصيام؟
    typo: هل يجوز للسواقين القصر والفطر في رمضان وهم دايم مسافرين
    english: Can a truck driver who is always on the road shorten prayers and skip fasting in Ramadan?
  - id: "2627"
    topic: القصر بعد وصول المسافر إلى بلده
    also: ["5032"]
    formal: إذا بلغ المسافر أهله وقد دخل وقت العصر، فهل يصليها ركعتين أم أربعًا؟
    colloquial: صليت الظهر بالطريق ووصلت البيت وقت العصر، أصلي العصر قصر ولا كاملة؟
    short: القصر بعد الوصول للبلد؟
    indirect: رجعت من رحلتي ودخلت بيتي والعصر ما صليته، كم ركعة أصليها؟
    synonym: من رجع إلى موطنه قبل أن يؤدي العصر، هل يختصرها أم يتمها؟
    typo: وصلت بلدي بعد السفر هل اقصر العصر
    english: I prayed Dhuhr on the road and reached home at Asr time. Do I shorten Asr?
  - id: "5026"
    topic: القصر والجمع في السفينة
    formal: هل يقصر ويجمع من يعمل على متن سفينة تبحر أيامًا قريبًا من الساحل؟
    colloquial: أنا بحري ونطلع بالسفينة ثلاث أربع أيام قريب من الميناء، نقصر ونجمع؟
    short: القصر في السفينة؟
    indirect: وظيفتي على ظهر سفينة عسكرية ونبقى أيامًا في الماء قرب الشاطئ، كيف نصلي الفروض؟
    synonym: هل يُباح للبحّارة اختصار الصلاة وضمّها حين يبحرون قرب الشاطئ؟
    typo: هل يجوز القصر والجمع للبحاره في السفينه
    english: Can sailors shorten and combine prayers while at sea for a few days near the port?

  # ── أحكام الجمع ──
  - id: "1080"
    topic: الجمع بين الصلاتين للمطر
    also: ["2957", "3526", "5075", "12060", "13134", "2155"]
    formal: هل يشرع ضم الظهر إلى العصر والمغرب إلى العشاء بسبب نزول الأمطار؟
    colloquial: إذا الدنيا تمطر بقوة، نجمع الظهر مع العصر والمغرب مع العشاء؟
    short: الجمع للمطر؟
    indirect: السيول مغرقة الطرق والناس تتعب توصل المسجد، هل يصلي الإمام الصلاتين مع بعض؟
    synonym: هل يسوغ الجمع بين الفريضتين عند هطول الغيث؟
    typo: هل يجوز الجمع بين الصلاتين في المطرر
    english: Can we combine Dhuhr with Asr and Maghrib with Isha because of rain?
  - id: "4796"
    topic: الجمع لرجال إطفاء الحرائق
    formal: هل يباح لرجل الدفاع المدني الجمع بين المغرب والعشاء إذا شغله إطفاء حريق؟
    colloquial: أنا بالدفاع المدني وأحيان يجينا بلاغ حريق من المغرب لين العشاء، أجمع؟
    short: الجمع لرجل الإطفاء؟
    indirect: انشغلت بإخماد نار في مبنى من غروب الشمس حتى أذان العشاء، كيف أصلي المغرب؟
    synonym: هل يجوز لعامل الإطفاء ضم الصلاتين حين ينشغل بإخماد النيران؟
    typo: هل يجوز لرجال الاطفاء الجمع بين الصلاتين وقت الحريق
    english: I'm a firefighter and a fire kept me busy from Maghrib until Isha. Can I combine the two prayers?
  - id: "5028"
    topic: الأفضل في الجمع التقديم أو التأخير
    also: ["5030"]
    formal: أيهما أفضل للمسافر عند الجمع، أن يقدم العصر إلى وقت الظهر أم يؤخر الظهر إلى وقت العصر؟
    colloquial: وأنا مسافر، الأحسن أجمع الظهر والعصر أول الوقت ولا أأخرهم؟
    short: جمع تقديم أم تأخير؟
    indirect: بنمشي من الاستراحة قبل الظهر بشوي، متى أصلي الظهر والعصر؟
    synonym: ما الأولى في ضم الصلاتين للمرتحل، تعجيلهما أم إرجاؤهما؟
    typo: الافضل جمع التقديم او التاخير
    english: When combining prayers while travelling, is it better to pray them early or delay them?
  - id: "5085"
    topic: جمع العصر مع الجمعة
    also: ["13697", "5088"]
    formal: هل يصح للمسافر أن يصلي العصر مجموعة مع الجمعة؟
    colloquial: صليت الجمعة بالطريق وأنا مسافر وصليت العصر وراها على طول، يصح؟
    short: جمع العصر مع الجمعة؟
    indirect: كنت في طريقي للعمرة وحضرت الخطبة والصلاة يوم الجمعة، ثم أقمت مباشرة للفريضة التالية، فهل فعلي صحيح؟
    synonym: هل يجوز ضم صلاة العصر إلى صلاة الجمعة؟
    typo: هل يجوز جمع العصر مع الجمعه للمسافر
    english: Can a traveller combine Asr with the Friday prayer?

  # ── الأعذار المبيحة للفطر ──
  - id: "4423"
    topic: الصوم أو الفطر للمسافر
    also: ["4929"]
    formal: هل يجب على المسافر أن يصوم رمضان أم له الفطر، وأيهما أفضل؟
    colloquial: وأنا مسافر برمضان، أصوم ولا أفطر أحسن؟
    short: صوم المسافر؟
    indirect: عندي رحلة في نهار رمضان ما فيها مشقة كبيرة، الأفضل أكمل صيامي ولا آخذ بالرخصة؟
    synonym: ما الحكم في إمساك المرتحل في الشهر الكريم؟
    typo: ماحكم صيام المسافر في رمضان
    english: Is it better for a traveller to fast or not fast in Ramadan?
  - id: "7216"
    topic: صيام المصاب بالصرع
    formal: ما حكم صوم من يعاني من نوبات الصرع؟
    colloquial: أخوي عنده صرع ويجيه نوبات وهو صايم، صيامه صحيح؟
    short: صيام مريض الصرع؟
    indirect: تأتيني تشنجات يغيب معها وعيي بعض الوقت في نهار رمضان، فهل يبطل صومي؟
    synonym: هل يصح صيام المصاب بالنوبات العصبية التشنجية؟
    typo: حكم صيام المصاب بالصرع في رمضن
    english: Is the fast valid for someone with epilepsy who has seizures?
  - id: "7469"
    topic: صيام المرضع
    formal: هل يباح للمرضع الفطر في رمضان إذا شق عليها الصيام بسبب الإرضاع؟
    colloquial: زوجتي ترضع البيبي وجاها رمضان، تفطر ولا لازم تصوم؟
    short: صيام المرضع؟
    indirect: ولدت امرأتي أول رمضان الماضي وهي إلى الآن تُرضع والصيام يتعبها، ما الذي يلزمها؟
    synonym: هل للمرأة التي تُلقِم طفلها الثدي أن تترك الصوم؟
    typo: هل يجوز للمرضع الافطار في رمضان
    english: Can a breastfeeding mother skip fasting in Ramadan?
  - id: "5948"
    topic: فطر المعتمر في مكة في رمضان
    also: ["1815"]
    formal: هل للمعتمر في رمضان أن يفطر مدة بقائه في مكة؟
    colloquial: رايحين نعتمر برمضان، نقدر نفطر وحنا بمكة ولا لازم نصوم أول ما نوصل؟
    short: فطر المعتمر بمكة؟
    indirect: سافرت مع عائلتي من الرياض لأداء العمرة في الشهر الكريم وسنبقى ثلاثة أيام، هل نبقى صائمين؟
    synonym: هل يجوز لمن قصد البيت الحرام بالعمرة في شهر الصوم أن يأكل أثناء إقامته هناك؟
    typo: هل يجوز للمعتمر الفطر في مكه في رمضان
    english: If we do Umrah in Ramadan, can we break our fast while staying in Makkah?

  # ── صلاة المريض ──
  - id: "4069"
    topic: قضاء الصلوات الفائتة حال الإغماء
    also: ["4980"]
    formal: ما الحكم في الصلوات التي فاتت شخصًا أثناء إغمائه الطويل وبعد إفاقته؟
    colloquial: واحد صار له حادث وغاب عن الوعي قرابة شهرين وبعدها ما صلى فترة، يقضي الصلوات؟
    short: قضاء صلوات المغمى عليه؟
    indirect: صديقي ظل في العناية المركزة فاقدًا وعيه أسابيع، ولما أفاق ترك الفروض لعجزه عن الطهارة، فما الذي يلزمه؟
    synonym: هل يقضي فاقد الوعي ما فاته من الفرائض زمن غيبوبته؟
    typo: هل يعيد الصلاه اللي فاتت وقت الاغماء
    english: Does someone who was in a coma for weeks have to make up the prayers he missed?
  - id: "7506"
    topic: صلاة المريض جالسًا
    also: ["7429"]
    formal: هل تصح صلاة المريض قاعدًا إذا عجز عن القيام؟
    colloquial: راسي يوجعني وما أقدر أوقف بالصلاة، أصلي وأنا جالسة؟
    short: صلاة المريض جالسًا؟
    indirect: أصابني مرض يجعل الوقوف في الفريضة مؤلمًا جدًا، فكيف أؤدي صلاتي؟
    synonym: هل يجوز للعليل أداء الفريضة قاعدًا؟
    typo: هل يجوز للمريض يصلي جالس
    english: Can a sick person pray sitting down if standing is too painful?
  - id: "2455"
    topic: الصلاة لمن به سلس الريح
    also: ["2822", "3736", "5548", "3735"]
    formal: ما الذي يلزم من به خروج ريح مستمر إذا توضأ للصلاة؟
    colloquial: عندي غازات تطلع مني باستمرار، كل ما توضأت تطلع، وش أسوي؟
    short: سلس الريح والصلاة؟
    indirect: أعاني من انفلات الهواء من بطني لا أستطيع التحكم فيه، فكيف أحافظ على طهارتي للصلاة؟
    synonym: كيف يتطهر من ابتُلي بخروج الهواء دائمًا ويصلي؟
    typo: ماذا يفعل من عنده سلس ريح بعد الوضؤ
    english: What should someone with constant gas do about wudu and prayer?
  - id: "5010"
    topic: صلاة المريض قبل العملية أو بعدها
    also: ["3951"]
    formal: هل يقدم المريض الصلاة قبل دخول وقتها إذا كانت لديه عملية جراحية، أم يؤخرها حتى يفيق؟
    colloquial: عندي عملية الصبح وبيخدروني، أصلي قبل ولا أنتظر لين أصحى؟
    short: الصلاة قبل العملية؟
    indirect: سأدخل غرفة العمليات تحت التخدير ولن أفيق إلا بعد ساعات، فكيف أتصرف مع الفرض القادم؟
    synonym: هل يُعجّل المريض الفريضة قبل الجراحة أم يرجئها حتى يصحو من البنج؟
    typo: هل يصلي المريض قبل العمليه ولا بعدها
    english: Should a patient pray before surgery or wait until after waking up from anesthesia?

  # ── إخراج الزكاة وأهلها ──
  - id: "1058"
    topic: زكاة المال المقترض
    also: ["3068"]
    formal: هل تجب الزكاة على المال المقترَض إذا حال عليه الحول عند المقترض؟
    colloquial: تسلفت فلوس من واحد وجلست عندي سنة، أزكيها؟
    short: زكاة القرض؟
    indirect: استدنت مبلغًا كبيرًا من صديقي وبقي في حسابي حولًا كاملًا، فهل أخرج عنه شيئًا؟
    synonym: هل في المال المستلَف صدقة واجبة؟
    typo: هل في القرض زكاه
    english: Do I have to pay zakat on money I borrowed if I've had it for a year?
  - id: "1022"
    topic: دفع الزكاة للأقارب
    formal: هل يجوز إعطاء الزكاة لفقراء الأقارب ولو كانوا من الورثة؟
    colloquial: أقدر أعطي زكاتي لقرايبي المحتاجين؟
    short: الزكاة للأقارب؟
    indirect: ابن عمي معسر ولا تلزمني نفقته، فهل أدفع إليه ما يجب في مالي؟
    synonym: هل يصح صرف الصدقة الواجبة لذوي القربى المحتاجين؟
    typo: هل يجوز دفع الزكاه للاقارب
    english: Can I give my zakat to poor relatives?
  - id: "1094"
    topic: زكاة المعادن
    formal: هل تجب الزكاة فيما يُستخرج من باطن الأرض من معادن؟
    colloquial: اللي يطلع من الأرض من معادن، عليه زكاة؟
    short: زكاة المعادن؟
    indirect: استخرجت من أرضي كمية من الحديد والنحاس لأبيعها، فهل علي فيها حق مالي؟
    synonym: هل في الثروات المستخرجة من المناجم صدقة واجبة؟
    typo: هل في المعادن زكاه
    english: Is zakat due on minerals extracted from the ground?
  - id: "1024"
    topic: نقل الزكاة إلى بلد آخر
    formal: هل يجوز إخراج الزكاة إلى بلد بعيد عن بلد المزكي؟
    colloquial: أقدر أرسل زكاتي لفقراء في دولة ثانية؟
    short: نقل الزكاة لبلد آخر؟
    indirect: أهلي في بلدي الأصلي محتاجون وأنا أعمل في الخارج، فهل أبعث صدقتي الواجبة إليهم؟
    synonym: هل يجوز تحويل الصدقة الواجبة خارج البلد الذي فيه المال؟
    typo: هل يجوز نقل الزكاه لبلد ثاني
    english: Can I send my zakat to poor people in another country?

  # ── مفسدات الصيام ──
  - id: "8398"
    topic: مضغ العلك للصائم
    formal: هل يفطر الصائم بمضغ العلك؟
    colloquial: العلك يفطر ولا لا وأنا صايم؟
    short: العلك للصائم؟
    indirect: أمضغ قطعة لها طعم في نهار رمضان وأبتلع ريقي معها، فهل يؤثر ذلك على صومي؟
    synonym: ما حكم لوك العلكة أثناء الصيام؟
    typo: هل اللبان يفطر الصايم
    english: Does chewing gum break the fast?
  - id: "11839"
    topic: شم الطيب والعود للصائم
    also: ["11843"]
    formal: هل يجوز للصائم استنشاق رائحة العطور والبخور؟
    colloquial: وأنا صايم أشم العود والعطر عادي؟
    short: شم البخور للصائم؟
    indirect: أبخّر البيت في نهار رمضان وأقرب الدخان من وجهي، هل يضر صيامي؟
    synonym: هل يؤثر تنشّق الطيب والبخور على صحة الصوم؟
    typo: هل يجوز للصايم يشم العود
    english: Can a fasting person smell perfume or incense?
  - id: "7346"
    topic: المضمضة والاستنشاق للصائم
    formal: هل يشرع للصائم أن يتمضمض ويستنشق في نهار رمضان؟
    colloquial: أتمضمض وأدخل الموية بخشمي وأنا صايم عادي؟
    short: المضمضة للصائم؟
    indirect: عند وضوئي في نهار رمضان أدخل الماء في فمي وأنفي، فهل علي حرج؟
    synonym: هل يجوز للممسك عن الطعام غسل الفم والأنف بالماء؟
    typo: هل يجوز المضمضه والاستنشاق للصايم
    english: Can I rinse my mouth and nose during wudu while fasting?
  - id: "10932"
    topic: الشمة والدخان للصائم
    formal: هل يؤثر استعمال الشمة (السعوط) على صحة الصيام؟
    colloquial: الشمة تفطر؟ يقولون ما تنزل للجوف
    short: الشمة للصائم؟
    indirect: بعض الناس يضعون التبغ المطحون في أفواههم وهم صائمون ويزعمون أنه لا يصل إلى البطن، فهل صومهم صحيح؟
    synonym: ما حكم تعاطي التبغ والنشوق أثناء الصوم؟
    typo: هل الشمه والدخان يفطر
    english: Does using snuff or smoking break the fast?

  # ── نواقض الوضوء ──
  - id: "3768"
    topic: علة نقض الوضوء بلحم الإبل
    also: ["3785"]
    formal: ما الحكمة من وجوب الوضوء بعد أكل لحم الإبل؟
    colloquial: ليش لحم الجمل ينقض الوضوء؟
    short: علة النقض بلحم الإبل؟
    indirect: أكلت كبسة لحم حاشي، وقالوا لازم أتوضأ قبل الصلاة، ليش؟
    synonym: ما سبب انتقاض الطهارة بتناول لحوم الجِمال؟
    typo: ليش لحم الابل ينقض الوضو
    english: Why does eating camel meat break wudu?
  - id: "985"
    topic: خروج الدم اليسير والوضوء
    formal: هل ينتقض الوضوء بخروج دم يسير من جرح؟
    colloquial: كنت متوضي وحكيت رجلي وطلع دم، وضوئي خرب؟
    short: الدم ينقض الوضوء؟
    indirect: جرحت إصبعي بالسكين بعد أن تطهرت للصلاة ونزلت قطرات، فهل أعيد طهارتي؟
    synonym: هل يُبطل النزيف القليل الطهارة؟
    typo: هل خروج الدم ينقض الوضو
    english: Does a little bleeding from a scratch break wudu?
  - id: "3772"
    topic: النوم ونقض الوضوء قبل الطواف
    also: ["3775"]
    formal: امرأة توضأت ثم نامت في السيارة وطافت دون أن تجدد الوضوء، فما حكم طوافها؟
    colloquial: توضيت ونمت بالسيارة وحنا رايحين مكة وطفت بدون ما أتوضى، طوافي صحيح؟
    short: الطواف بعد النوم بلا وضوء؟
    indirect: غفوت في الطريق إلى الحرم ثم أديت العمرة مباشرة دون طهارة جديدة، فما الذي يترتب علي؟
    synonym: هل يُبطل الرقاد الطهارة لمن طاف بعده؟
    typo: نمت بعد الوضوء وطفت هل طوافي صحيح
    english: I slept in the car after wudu and then did tawaf without renewing it. Is my tawaf valid?
  - id: "3783"
    topic: مصافحة غير المسلم والوضوء
    formal: هل ينتقض وضوء المسلم إذا سلّم باليد على غير مسلم؟
    colloquial: سلمت على واحد نصراني بيدي وأنا متوضي، ينتقض وضوئي؟
    short: مصافحة الكافر تنقض الوضوء؟
    indirect: زميلي في العمل غير مسلم وصافحته بعد ما تطهرت للصلاة، فهل أعيد الوضوء؟
    synonym: هل يبطل الوضوء بملامسة يد الكتابي؟
    typo: هل مصافحه النصراني تنقض الوضو
    english: Does shaking hands with a Christian or a Jew break my wudu?

  # ── الطلاق ──
  - id: "1285"
    topic: طلاق الحامل
    formal: هل يقع طلاق المرأة الحامل؟
    colloquial: يقولون الحامل ما عليها طلاق، صحيح الكلام هذا؟
    short: طلاق الحامل؟
    indirect: طلقت زوجتي وهي في شهرها الخامس، وأخبرني بعض الناس أن الطلاق لا يحسب، فهل هذا صحيح؟
    synonym: هل يصح فراق الزوجة وهي حُبلى؟
    typo: هل الحامل ماعليها طلاق
    english: Is a divorce valid if the wife is pregnant?
  - id: "1307"
    topic: الطلاق في الغضب الشديد
    also: ["1512"]
    formal: هل يقع الطلاق ممن اشتد غضبه حتى فقد السيطرة على نفسه؟
    colloquial: طلقت وأنا معصب مرة وما كنت حاس بنفسي، يقع؟
    short: طلاق الغضبان؟
    indirect: احتد النقاش بيني وبين زوجتي حتى خرجت عن طوري وتلفظت بالفراق دون وعي مني، فهل يحتسب؟
    synonym: ما حكم الفراق الصادر من الزوج حال الانفعال الشديد؟
    typo: حكم الطلاق وقت الغضب الشدبد
    english: Does a divorce count if the husband said it in extreme anger?
  - id: "1365"
    topic: الطلاق المعلق على رأس كل شهر
    formal: ما حكم من قال لامرأته أنتِ طالق مع بداية كل شهر؟
    colloquial: واحد قال لزوجته كل ما بدا شهر جديد فأنتي طالق، وش الحكم؟
    short: الطلاق المعلق ببداية كل شهر؟
    indirect: علّق رجل فراق زوجته على دخول كل شهر هجري، فما الذي يترتب على ذلك؟
    synonym: ما حكم تعليق الفراق على مطلع كل شهر؟
    typo: انتي طالق راس كل شهر وش حكمها
    english: 'What happens if a man tells his wife "you are divorced at the start of every month"?'
  - id: "154"
    topic: الزواج بنية الطلاق
    formal: ما حكم الزواج في بلد الغربة مع نية الطلاق عند انتهاء الدراسة؟
    colloquial: مبتعث وأبي أتزوج هناك وناوي أطلقها إذا خلصت دراستي، يجوز؟
    short: الزواج بنية الطلاق؟
    indirect: سأدرس في الخارج أربع سنوات وأريد أن أعف نفسي بزوجة هناك، على أن أفارقها إذا رجعت إلى بلدي، فهل هذا مثل المتعة؟
    synonym: ما حكم النكاح مع إضمار الفراق بعد مدة؟
    typo: حكم الزواج بنيه الطلاق في الغربه
    english: Is it allowed to marry abroad while intending to divorce when my studies end?

  # ── قضاء الصيام ──
  - id: "1247"
    topic: الفطر في صوم القضاء بعد الشروع فيه
    formal: هل يجوز قطع صيام القضاء بعد الشروع فيه وإبداله بيوم آخر؟
    colloquial: كنت صايم قضاء من رمضان وبغيت أفطر وأعوضه يوم ثاني، يجوز؟
    short: الفطر في صوم القضاء؟
    indirect: بدأت أصوم يومًا مما علي من الشهر الماضي ثم أردت الأكل ظهرًا على أن أصوم غدًا بدله، فهل لي ذلك؟
    synonym: هل يحل الإفطار لمن ابتدأ صوم الأيام الفائتة من رمضان؟
    typo: هل يجوز الافطار في صيام القضا
    english: If I start a make-up fast for Ramadan, can I break it and do another day instead?
  - id: "2239"
    topic: صوم القضاء إذا صادف أول رمضان
    formal: من نوى قضاء يوم من رمضان الماضي فتبين أنه أول أيام رمضان الحاضر، فهل يجزئه؟
    colloquial: صمت قضاء آخر يوم بشعبان وطلع أول يوم رمضان، ينحسب لي؟
    short: صام قضاء فصادف أول رمضان؟
    indirect: كنت أصوم دَيْنًا علي من العام الماضي، وفي منتصف النهار أُعلن ثبوت الهلال، فهل يكفيني هذا اليوم عن شيء؟
    synonym: هل يجزئ صوم الفائت إذا وافق أول يوم من الشهر الجديد؟
    typo: صمت قضا وطلع اول يوم رمضان هل يجزي
    english: I fasted a make-up day and it turned out to be the first day of Ramadan. Does it count?
  - id: "1549"
    topic: قضاء أيام من رمضان لا يعلم عددها
    formal: ماذا يصنع من عليه أيام من رمضان لا يعرف عددها؟
    colloquial: علي أيام من رمضان من زمان بسبب الدورة وما أدري كم عددها، وش أسوي؟
    short: قضاء أيام مجهولة العدد؟
    indirect: أفطرت أيام العادة في رمضان قبل سنوات ولم أقضها ونسيت كم هي، فكيف أبرئ ذمتي؟
    synonym: كيف يقضي من جهل مقدار ما فاته من صوم الشهر؟
    typo: ما ادري كم يوم علي من رمضان وش اسوي
    english: I owe some Ramadan fasts from years ago but don't know how many days. What should I do?
  - id: "4645"
    topic: التتابع في قضاء رمضان
    also: ["1354"]
    formal: هل يلزم التتابع في قضاء ما فات من رمضان؟
    colloquial: لازم أصوم أيام القضاء ورا بعض ولا أقدر أفرقها؟
    short: تفريق القضاء؟
    indirect: علي ستة أيام من الشهر وأريد أن أصوم يومي الاثنين والخميس فقط حتى أنتهي، فهل هذا مجزئ؟
    synonym: هل يشترط الموالاة في صوم الأيام الفائتة؟
    typo: هل يجب التتابع في قضا رمضان
    english: Do I have to make up missed Ramadan days consecutively?

  # ── من يجب عليه الصوم ──
  - id: "11360"
    topic: أمر الصبي المميز بالصيام
    also: ["11361"]
    formal: هل يؤمر الطفل المميز بصيام رمضان قبل بلوغه؟
    colloquial: ولدي عمره ثمان سنين، أخليه يصوم ولا لسا صغير؟
    short: صيام الطفل المميز؟
    indirect: ابنتي في التاسعة وتريد أن تصوم مع الأسرة، فهل علي أن أعودها على ذلك؟
    synonym: هل يُلزَم الصغير الذي يعقل بالإمساك في الشهر الكريم؟
    typo: هل الطفل الممبز يصوم
    english: Should a young child who understands be told to fast?
  - id: "2625"
    topic: الغيبوبة طوال رمضان
    also: ["14358"]
    formal: ما حكم صيام وصلاة من كان في غيبوبة طوال شهر رمضان؟
    colloquial: صار لي حادث وكنت بالغيبوبة طول رمضان، علي قضاء صيام وصلاة؟
    short: الغيبوبة في رمضان؟
    indirect: فقدت وعيي إثر حادث قبل دخول الشهر ولم أصحُ إلا بعد العيد، فما الذي يلزمني؟
    synonym: هل يقضي فاقد العقل بسبب إصابة ما فاته من صوم وصلاة؟
    typo: كنت في غيبوبه طول رمضان هل علي قضا
    english: I was in a coma for the whole of Ramadan. Do I have to make up the fasts and prayers?
  - id: "7843"
    topic: صيام غير المسلم
    formal: هل يصح صيام النصراني لشهر رمضان وهو لا يصلي؟
    colloquial: في قريتنا واحد مسيحي يصوم رمضان بس ما يصلي، صيامه مقبول؟
    short: صيام غير المسلم؟
    indirect: جارنا يدين بغير الإسلام لكنه يمسك عن الطعام مع المسلمين في الشهر الفضيل، فهل ينفعه ذلك؟
    synonym: هل يُقبل صوم الكتابي الذي لم يدخل في الإسلام؟
    typo: هل صيام المسيحي صحيح في رمضان
    english: Is the Ramadan fast of a Christian who doesn't pray valid?

  # ── التيمم ──
  - id: "1179"
    topic: الترتيب في التيمم
    formal: هل يجب البدء بالوجه قبل الكفين في التيمم؟
    colloquial: بالتيمم لازم أمسح وجهي أول بعدين يديني؟
    short: الترتيب في التيمم؟
    indirect: ضربت التراب ومسحت كفي أولًا ثم وجهي، فهل تيممي صحيح؟
    synonym: هل يلزم تقديم مسح الوجه على اليدين في الطهارة بالتراب؟
    typo: هل الترتيب واجب في التيمن
    english: In tayammum, must I wipe my face before my hands?
  - id: "6197"
    topic: النفخ في اليدين عند التيمم
    formal: هل يسن النفخ في الكفين بعد ضرب التراب في التيمم؟
    colloquial: لما أضرب التراب للتيمم أنفخ في يديني؟
    short: النفخ في التيمم؟
    indirect: بعد أن وضعت يدي على الأرض للطهارة علق بهما غبار كثير، فهل أزيله بنَفَسي؟
    synonym: هل يشرع نفض اليدين بالنفَس عند المسح بالصعيد؟
    typo: هل يشرع النفخ في اليدين عند التيمن
    english: Should I blow on my hands after striking the earth in tayammum?
  - id: "3828"
    topic: من تيمم ثم وجد الماء قبل خروج الوقت
    formal: من تيمم لشكه في طهارة الماء ثم وجد ماءً قبل خروج وقت الصلاة، فما حكم صلاته؟
    colloquial: كنا مسافرين وتيممنا لأننا شاكين بالموية اللي بالطريق، وبعدين لقينا موية والوقت باقي، نعيد؟
    short: وجد الماء بعد التيمم؟
    indirect: صلينا بالتراب في رحلة رغم وجود غدير لأننا خشينا أن يكون متنجسًا، ثم وجدنا ماءً نظيفًا والوقت لم ينته، فما العمل؟
    synonym: هل يعيد من تطهر بالصعيد ثم عثر على الماء قبل فوات الوقت؟
    typo: تيممت وبعدين لقيت الما قبل خروج الوقت
    english: We did tayammum because we doubted the water was pure, then found clean water before the prayer time ended. What is the ruling?
  - id: "5329"
    topic: التيمم بالتراب المستعمل
    formal: هل يصح التيمم بتراب سبق التيمم به؟
    colloquial: عندنا تراب بإناء نتيمم منه للمريض كل مرة، يصح؟
    short: التيمم بتراب مستعمل؟
    indirect: والدي طريح الفراش ونضع له وعاء فيه تراب يتطهر منه لكل فرض، فهل يلزم تغييره؟
    synonym: هل يُجزئ الصعيد الذي استُعمل للطهارة من قبل؟
    typo: هل يجوز التيمم بالتراب المستعمل مره ثانيه
    english: Can the same dust in a container be reused for tayammum several times?

  # ── فروض الوضوء وصفته ──
  - id: "3580"
    topic: الوضوء بالبترول
    formal: هل تصح الطهارة بالبنزين بدلًا من الماء؟
    colloquial: لو ما لقيت موية أتوضى بالبنزين؟
    short: الوضوء بالبنزين؟
    indirect: كنت في البر ونفد الماء وعندي وقود السيارة، فهل أغسل به أعضائي للصلاة؟
    synonym: هل يجزئ استعمال الوقود السائل في رفع الحدث؟
    typo: هل يجوز الوضو بالبترول
    english: Can I make wudu with petrol if there is no water?
  - id: "3521"
    topic: نسيان التسمية قبل الوضوء
    formal: ما حكم الوضوء إذا ترك المتوضئ التسمية نسيانًا؟
    colloquial: نسيت أقول بسم الله قبل ما أتوضى، وضوئي صحيح؟
    short: نسيان البسملة في الوضوء؟
    indirect: تذكرت وأنا أغسل يدي في الطهارة أني لم أذكر اسم الله في أولها، فماذا أفعل؟
    synonym: هل يبطل الوضوء بإغفال البسملة سهوًا؟
    typo: نسيت التسميه قبل الوضو
    english: I forgot to say bismillah before wudu. Is my wudu valid?
  - id: "2616"
    topic: التنشيف بعد الوضوء
    formal: هل يجوز تجفيف الأعضاء بالمنديل بعد الوضوء أم الأفضل تركها؟
    colloquial: أنشف وجهي ويديني بالفوطة بعد الوضوء عادي؟
    short: التنشيف بعد الوضوء؟
    indirect: بعد أن أتطهر للصلاة أمسح الماء عن جسمي بقطعة قماش، فهل هذا مكروه؟
    synonym: ما حكم مسح بلل الطهارة بالخرقة؟
    typo: هل يجوز التنشيف بعد الوضو
    english: Is it allowed to dry myself with a towel after wudu?
  - id: "3581"
    topic: الوضوء بالماء المخلوط بالكلور
    formal: هل يصح الوضوء بماء أُضيف إليه الكلور فتغير لونه وطعمه؟
    colloquial: موية الشرب عندنا فيها كلور وريحتها متغيرة، أتوضى منها؟
    short: الوضوء بماء فيه كلور؟
    indirect: تُعالج مياه بلدتنا بمادة معقمة تغير طعمها ولونها، فهل يجزئ التطهر بها؟
    synonym: هل يرفع الحدث الماء المعقم بالمطهرات الكيميائية؟
    typo: هل يجوز الوضو بماء فيه كلور
    english: Can I make wudu with chlorinated tap water?

  # ── وجوب الزكاة وأهميتها ──
  - id: "3074"
    topic: زكاة رصيد يبلغ النصاب في بعض الأشهر
    formal: هل تجب الزكاة في رصيد ينقص عن النصاب في بعض الشهور ويزيد في بعضها؟
    colloquial: حسابي بالبنك مرات ينزل تحت النصاب ومرات يزيد، علي زكاة؟
    short: زكاة رصيد متذبذب؟
    indirect: راتبي يدخل البنك ثم أصرف أغلبه، فأحيانًا يكون عندي عشرة آلاف وأحيانًا أقل بكثير، فكيف أعرف متى أخرج حق المال؟
    synonym: كيف يُحسب الحول لمال يتأرجح بين بلوغ القدر الواجب ونقصانه؟
    typo: رصيدي ينقص عن النصاب بعض الاشهر هل علي زكاه
    english: My bank balance goes below the zakat threshold in some months. Do I owe zakat?
  - id: "6501"
    topic: الجهل بوجوب الزكاة لا يسقطها
    also: ["6500"]
    formal: هل تلزم الزكاة عن السنوات الماضية من كان يجهل وجوبها؟
    colloquial: ما كنت أدري إن الفلوس اللي أجمعها عليها زكاة، أطلع عن السنين اللي فاتت؟
    short: زكاة السنين الماضية للجاهل؟
    indirect: ادخرت مالًا خمس سنوات لشراء بيت ولم يخبرني أحد أن عليه حقًا، فهل أخرج عن كل تلك الأعوام؟
    synonym: هل يُسقط عدمُ العلم بالفريضة المالية ما مضى منها؟
    typo: ما كنت اعرف ان علي زكاه هل اخرجها عن السنوات الماضيه
    english: I didn't know zakat was due on my savings. Do I have to pay for past years?
