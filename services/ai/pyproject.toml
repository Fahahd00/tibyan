[project]
name = "tibyan-ai"
version = "1.1.0"
description = "Tibyan AI service: question pipeline, hybrid RAG, citation verification, safety gate"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "fastembed>=0.5",
  "anthropic>=0.70",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[project.scripts]
tibyan-ai = "tibyan_ai.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tibyan_ai*"]

[tool.setuptools.package-data]
tibyan_ai = ["rules/*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a running PostgreSQL with pgvector (TIBYAN_TEST_DATABASE_URL)",
]
