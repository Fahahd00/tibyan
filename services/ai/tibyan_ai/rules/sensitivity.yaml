# Sensitivity rules — owned by the governance lead. Changes require governance review.
#
# Terms are matched on *normalized* text (no diacritics, ا/أ/إ/آ → ا, ة → ه, ى → ي),
# so write them in normalized form. A single-word term also matches with a leading و/ف/ب/ل.
#
# Classification:
#   high_risk      → any high_risk term                          → ESCALATION (no answer)
#   personal_case  → a sensitive topic AND a personal marker      → ESCALATION (no ruling)
#   sensitive_topic→ a sensitive topic only (general question)    → answer general info + referral notice
#   general        → otherwise

