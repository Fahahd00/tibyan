name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Frontend + Backend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build shared contracts
        run: npm run build -w @tibyan/contracts
      - name: Lint
        run: npm run lint -w @tibyan/contracts -w @tibyan/api -w @tibyan/web
      - name: Typecheck
        run: npm run typecheck -w @tibyan/contracts -w @tibyan/api -w @tibyan/web
      - name: Unit tests (API)
        run: npm test -w @tibyan/api
      - name: Build
        run: npm run build -w @tibyan/api && npm run build -w @tibyan/web
      - name: Prettier
        run: npm run format:check

  python:
    name: AI service (lint · unit + integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tibyan
          POSTGRES_PASSWORD: tibyan
          POSTGRES_DB: tibyan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tibyan -d tibyan_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,openai]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Fetch the test fatwas from binbaz.org.sa (texts are not in the repository)
        run: python -m tibyan_ai.cli fetch-corpus --source binbaz --ids-file tests/fixture_fatwas.txt --delay 0.5 || true
      - name: Tests (no real API keys; test-only hash embeddings, real PostgreSQL + pgvector)
        env:
          TIBYAN_TEST_DATABASE_URL: postgresql://tibyan:tibyan@localhost:5432/tibyan_test
        run: pytest -q

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [node, python]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
