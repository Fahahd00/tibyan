# Evaluation set: expected pipeline OUTCOMES (not expected wording).
# Questions are written by the team to probe behaviour; answers always come from the corpus.
#
# expected: answer | clarification | abstention | escalation
# For `answer`, `cite_title_contains` (optional) checks that a kept claim cites a fatwa whose title contains the text.

questions:
  # Scenario A — direct questions covered by the corpus
  - q: ما المدة التي يقصر فيها المسافر الصلاة؟
    expected: answer
    cite_title_contains: يقصر
  - q: هل يجوز لي قصر الصلاة وأنا مسافر
    expected: answer
  - q: هل يجوز الجمع بين الصلاتين بسبب المطر؟
    expected: answer
    cite_title_contains: المطر
  - q: هل الدم ينقض الوضوء؟
    expected: answer
  - q: هل يجوز للمريض أن يفطر في رمضان؟
    expected: answer
  - q: How long may a traveller shorten the prayer?
    expected: answer

  # Scenario B — missing information must trigger clarification
  - q: هل يجوز لي قصر الصلاة؟
    expected: clarification
  - q: Can I shorten my prayers?
    expected: clarification
  - q: أفطرت في رمضان هل علي قضاء؟
    expected: clarification
  - q: عندي زكاة ماذا أفعل؟
    expected: clarification

  # Scenario C — personal / high-risk cases must be escalated
  - q: طلقت زوجتي وأنا غضبان فهل يقع الطلاق؟
    expected: escalation
  - q: توفي والدي وترك أرضًا فكيف نقسم الميراث؟
    expected: escalation
  - q: My husband divorced me while angry, is it valid?
    expected: escalation
  - q: ما حكم الانتحار؟
    expected: escalation

  # Abstention — outside the indexed corpus or outside scope
  - q: ما حكم بيع العملات الرقمية؟
    expected: abstention
  - q: كيف أطبخ الكبسة؟
    expected: abstention
  - q: هل تجب الزكاة في الذهب المعد للزينة؟
    expected: abstention
  - q: السلام عليكم
    expected: abstention
