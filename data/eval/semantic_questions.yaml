# Semantic Retrieval Evaluation set.
#
# 40 fatwas that exist in the indexed corpus (binbaz.org.sa). For each one:
#   original  — read verbatim from the source snapshot at run time (not repeated here)
#   formal / colloquial / short / different — written by hand for this evaluation, meaning preserved,
#   wording deliberately changed (not word swaps). typo / english for a subset.
# `id` is the expected fatwa; `also` lists other fatwas in the corpus that answer the SAME issue (near-duplicates),
# used only for the lenient metric. The system is never told the expected source.

items:
  # ── صلاة المسافر ──
  - id: "4395"
    formal: هل تبقى السنن الرواتب مشروعة في حال السفر؟
    colloquial: إذا سافرت أصلي السنن اللي قبل وبعد الفروض ولا أتركها؟
    short: الرواتب في السفر؟
    different: المسافر حين يقصر الفريضة، ماذا يفعل بالنوافل المرتبطة بها؟
    typo: هل اصلي السنن الرواتب وانا مسافر
    english: Should a traveller still pray the regular sunnah prayers?
  - id: "2768"
    formal: من سافر ثمانين كيلومترًا ورجع في اليوم نفسه، هل له أن يقصر؟
    colloquial: رحت مشوار 80 كيلو ورجعت نفس اليوم، أقصر الصلاة ولا لا؟
    short: قصر الصلاة لسفر يوم واحد؟
    different: إذا كانت الرحلة ذهابًا وإيابًا في نهار واحد لمسافة ثمانين كيلًا، فهل تُعد سفرًا تقصر فيه الصلاة؟
  - id: "5017"
    also: ["1419", "5013", "5015"]
    formal: ما حكم أن يصلي المقيم خلف إمام مسافر، والمسافر خلف إمام مقيم؟
    colloquial: إذا صليت وأنا مسافر ورا إمام مقيم، أكمل أربع ولا أقصر؟
    short: المسافر خلف المقيم؟
    different: اختلف حال الإمام والمأموم سفرًا وإقامة، فكيف تكون صلاة كل منهما؟
    english: If a traveller prays behind a resident imam, does he shorten or complete the prayer?
  - id: "5025"
    also: ["2461", "3338", "1678", "5023"]
    formal: هل للمسافر أن يقصر مهما طالت مدة إقامته، أم أن للقصر حدًا زمنيًا؟
    colloquial: أنا مسافر وبجلس هناك كم يوم، لين متى أقدر أقصر الصلاة؟
    short: مدة القصر للمسافر؟
    different: إقامة المسافر في بلد غير بلده، متى تنتهي معها رخصة القصر؟
    typo: كم يوم يقصر المسافر الصلاه
    english: How long can a traveller keep shortening the prayer?

  # ── نواقض الوضوء وصفته ──
  - id: "3785"
    formal: هل ينتقض الوضوء بأكل لحم الإبل؟
    colloquial: أكلت لحم جمل وأنا متوضي، لازم أعيد الوضوء؟
    short: لحم الإبل والوضوء؟
    different: من تناول من لحوم الإبل وهو على طهارة، هل تبقى طهارته؟
    typo: اكل لحم الابل ينقض الوضوء
    english: Does eating camel meat break wudu?
  - id: "1973"
    formal: من مسح على جوربيه ثم خلعهما بعد الوضوء، هل يبطل وضوؤه؟
    colloquial: مسحت على الشراب وبعدين فصخته، وضوئي راح ولا لا؟
    short: خلع الجورب بعد المسح؟
    different: بعد المسح على الخفين ونزعهما، هل يلزم تجديد الطهارة؟
  - id: "1449"
    also: ["3747", "3749"]
    formal: هل يجب الوضوء على الرجل إذا لمسته زوجته؟
    colloquial: زوجتي لمست يدي وأنا متوضي، ينتقض وضوئي؟
    short: لمس الزوجة والوضوء؟
    different: مجرد ملامسة الزوجين أحدهما للآخر، هل لها أثر على الطهارة؟
    english: Does touching one's wife invalidate wudu?
  - id: "3784"
    formal: هل يبطل الوضوء إذا رد المتوضئ السلام أثناء وضوئه؟
    colloquial: واحد سلم علي وأنا أتوضأ ورديت عليه، فيه شي؟
    short: رد السلام وقت الوضوء؟
    different: الكلام في أثناء الوضوء كرد التحية، هل يؤثر عليه أو يكره؟
  - id: "1807"
    formal: كيف يتوضأ ويصلي من به سلس بول تخرج منه قطرات بعد الوضوء؟
    colloquial: عندي سلس بول، تنزل نقطتين بعد ما أتوضأ، وش أسوي بصلاتي؟
    short: سلس البول والوضوء؟
    different: من لا يستمسك بوله ويخرج منه شيء يسير بعد طهارته، ما الواجب عليه للصلاة؟
    typo: عندي سلس بول كيف اتوضا
  - id: "3611"
    formal: هل يجب على المرأة إزالة طلاء الأظافر عند الوضوء؟
    colloquial: حاطة مناكير، يصح وضوئي ولا لازم أشيله؟
    short: المناكير والوضوء؟
    different: الطلاء الذي يغطي الأظافر ويمنع وصول الماء، ما حكمه في الطهارة؟
  - id: "3650"
    formal: هل يلزم إيصال الماء إلى منابت شعر اللحية الكثيفة في الوضوء؟
    colloquial: لحيتي كثيفة، لازم أدخل الموية لين جلد الوجه؟
    short: غسل اللحية الكثيفة؟
    different: اللحية الكثة عند غسل الوجه، هل يكفي إمرار الماء على ظاهرها؟
  - id: "3773"
    also: ["3772", "3775"]
    formal: هل ينتقض الوضوء بالنعاس اليسير؟
    colloquial: جاني نعاس وأنا أنتظر الصلاة، أعيد الوضوء؟
    short: النعاس ينقض الوضوء؟
    different: الغفوة الخفيفة أثناء الجلوس في المسجد، هل تبطل الطهارة؟
    english: Does dozing off while waiting for prayer break wudu?

  # ── الزكاة ──
  - id: "1386"
    formal: هل تجب الزكاة في مال ادخره صاحبه للزواج وحال عليه الحول؟
    colloquial: مجمع فلوس عشان أتزوج ومر عليها سنة، تجيها زكاة؟
    short: زكاة مال الزواج؟
    different: المبلغ المحفوظ لتكاليف الزواج إذا بلغ النصاب، هل يُزكى؟
  - id: "1779"
    formal: هل يجوز إسقاط الدين عن الفقير واحتسابه من الزكاة؟
    colloquial: واحد مستلف مني فلوس وصار فقير، أحسبها عليه من الزكاة؟
    short: إسقاط الدين من الزكاة؟
    different: لي مال عند معسر يستحق الزكاة، فهل أبرئه منه وأعده زكاة مالي؟
  - id: "1278"
    formal: هل يجوز صرف الزكاة في بناء المساجد؟
    colloquial: أقدر أعطي زكاتي لبناء مسجد؟
    short: الزكاة لبناء المساجد؟
    different: تعمير بيوت الله، هل هو من مصارف الزكاة الشرعية؟
    english: Can zakat money be used to build a mosque?
  - id: "3068"
    formal: على من تجب زكاة القرض الحسن، على المقرض أم المقترض؟
    colloquial: سلفت واحد فلوس، الزكاة علي ولا عليه؟
    short: زكاة القرض؟
    different: المال الذي أعطيته دينًا لغيري، من يتحمل زكاته؟
  - id: "6502"
    formal: هل تجب الزكاة في أموال الأيتام، ومن الذي يخرجها؟
    colloquial: أبوهم توفى وترك لهم فلوس، عليها زكاة ومين يطلعها؟
    short: زكاة مال اليتيم؟
    different: الصغار الذين ورثوا مالًا بعد وفاة أبيهم، هل يلزم في مالهم زكاة؟

  # ── الأعذار المبيحة للفطر ──
  - id: "7215"
    formal: ما حكم صيام مريض السكري في رمضان؟
    colloquial: عندي سكر، أصوم رمضان ولا يجوز لي أفطر؟
    short: صيام مريض السكر؟
    different: المصاب بداء السكري إذا شق عليه الصوم، ما الذي يلزمه؟
    english: Does a diabetic have to fast in Ramadan?
  - id: "8065"
    formal: هل يجوز لمن يجري غسيل الكلى أن يفطر في رمضان؟
    colloquial: أبوي يسوي غسيل كلى ثلاث مرات بالأسبوع، يصوم ولا يفطر؟
    short: الغسيل الكلوي والصيام؟
    different: مريض الفشل الكلوي في أيام جلسات الغسيل، ما حكم صيامه؟
  - id: "6892"
    also: ["10657"]
    formal: هل يجوز للطالب الفطر في رمضان من أجل الاختبارات؟
    colloquial: عندي اختبارات في رمضان، أفطر عشان أذاكر؟
    short: الفطر للامتحانات؟
    different: ضغط الدراسة وقت الامتحانات في شهر الصوم، هل يبيح الإفطار؟
    typo: افطر عشان الاختبارات في رمضان
  - id: "2773"
    formal: ما الواجب على من مرض مرضًا مزمنًا لا يرجى شفاؤه ولا يستطيع الصيام؟
    colloquial: مرضي مزمن وما أقدر أصوم أبد، وش علي؟
    short: المريض الذي لا يرجى شفاؤه؟
    different: من عجز عن الصوم عجزًا دائمًا بسبب علة لا تزول، ما البديل عن صيامه؟
  - id: "3081"
    formal: هل يجوز للمسافر أن يفطر في بيته قبل أن يغادر بلده؟
    colloquial: ناوي أسافر بالنهار في رمضان، أفطر من البيت قبل ما أطلع؟
    short: الفطر قبل الخروج للسفر؟
    different: من عزم على السفر في نهار رمضان، متى يبدأ له الإفطار؟

  # ── مفسدات الصيام ──
  - id: "1241"
    formal: هل الحجامة تفطر الصائم؟
    colloquial: أبي أتحجم وأنا صايم، يخرب صيامي؟
    short: الحجامة للصائم؟
    different: إخراج الدم بالحجامة في نهار الصوم، هل يفسد الصيام أم هو منسوخ؟
    typo: الحجامه تفطر الصايم
    english: Does cupping (hijama) break the fast?
  - id: "11843"
    also: ["11839"]
    formal: هل يجوز للصائم استعمال الطيب والبخور في نهار رمضان؟
    colloquial: أتبخر وأحط عطر وأنا صايم عادي؟
    short: البخور للصائم؟
    different: التطيب بدهن العود والكولونيا خلال الصيام، هل فيه بأس؟
  - id: "11806"
    formal: ما حكم استعمال معجون الأسنان وقطرة العين والأذن للصائم؟
    colloquial: أفرش بالمعجون وأحط قطرة عين وأنا صايم، يفطر؟
    short: قطرة العين للصائم؟
    different: المعجون والقطرات في الأنف والعين والأذن، هل تفسد الصوم إذا وجد طعمها؟
  - id: "4674"
    formal: هل يجوز الأكل أو الشرب أثناء أذان الفجر في رمضان؟
    colloquial: الأذان يأذن وأنا أشرب موية، أكمل ولا أوقف؟
    short: الشرب مع أذان الفجر؟
    different: إذا بدأ المؤذن ينادي لصلاة الصبح وفي يدك الإناء، هل تكمل شربك؟
  - id: "11755"
    formal: هل الإبر المغذية تفسد الصيام؟
    colloquial: أخذت مغذي بالوريد وأنا صايم، صيامي صحيح؟
    short: الإبر المغذية تفطر؟
    different: الحقن التي تقوم مقام الطعام والشراب، ما أثرها على صحة الصوم؟
    english: Do nutritional IV injections break the fast?

  # ── أحكام الجمع ──
  - id: "1763"
    also: ["2957", "12949"]
    formal: هل يشترط للجمع بسبب المطر أن يكون نازلًا وقت الصلاة؟
    colloquial: المطر وقف قبل الصلاة، نقدر نجمع ولا لا؟
    short: شرط الجمع في المطر؟
    different: الجمع للمطر، هل يكفي أن يكون الجو ممطرًا قبله أم لا بد من نزوله عند الصلاة؟
  - id: "11875"
    also: ["6299", "5091"]
    formal: ما حكم الجمع بين الصلاتين بسبب الدوام والعمل؟
    colloquial: دوامي طويل، أجمع الظهر مع العصر عشان الشغل؟
    short: الجمع بسبب العمل؟
    different: الموظف المشغول بعمله، هل له أن يضم صلاة إلى أخرى؟
    english: Can I combine prayers because of my work schedule?
  - id: "5079"
    formal: هل تشترط الموالاة بين الصلاتين المجموعتين؟
    colloquial: جمعنا بس تأخرنا شوي بين الصلاتين، صح جمعنا؟
    short: الفاصل بين الصلاتين عند الجمع؟
    different: إذا طال الوقت بين الأولى والثانية في الجمع، هل يبطل الجمع؟

  # ── التيمم ──
  - id: "3834"
    also: ["3796"]
    formal: هل يتيمم الجنب إذا لم يستطع الاغتسال لشدة البرد؟
    colloquial: البرد شديد وما فيه موية حارة، أتيمم بدل الغسل؟
    short: التيمم للبرد؟
    different: من خاف الضرر من الماء البارد في الشتاء وعليه جنابة، بماذا يتطهر؟
    english: Can I do tayammum instead of ghusl because the water is too cold?
  - id: "3837"
    formal: هل يجب التيمم لكل صلاة، أم يصلي بالتيمم الواحد عدة فروض؟
    colloquial: تيممت مرة، أصلي فيه كل الصلوات ولا أعيده كل مرة؟
    short: التيمم لكل صلاة؟
    different: الطهارة بالتراب، هل تبقى صالحة لأكثر من فريضة؟
  - id: "3832"
    also: ["1422", "3831"]
    formal: كيف يتيمم من على يده جبيرة أو جروح يضرها الماء؟
    colloquial: يدي فيها جبس، كيف أتوضأ أو أتيمم؟
    short: التيمم مع الجبس؟
    different: العضو المجبور الذي لا يصله الماء، ما حكم طهارته؟
  - id: "1548"
    also: ["3826"]
    formal: ما الصفة الصحيحة للتيمم؟
    colloquial: كيف أتيمم بالضبط؟
    short: طريقة التيمم؟
    different: علمني خطوات الطهارة بالتراب كما وردت في السنة.
    typo: كيف اتيمم صح
    english: How do I perform tayammum correctly?

  # ── صلاة المريض ──
  - id: "5184"
    also: ["7506", "5008", "5007"]
    formal: هل يجوز للمريض أو كبير السن أن يصلي جالسًا؟
    colloquial: ركبي تعورني وما أقدر أوقف، أصلي وأنا جالس؟
    short: الصلاة جالسًا للمريض؟
    different: العاجز عن القيام لألم أو كبر، كيف يؤدي صلاته؟
    english: Can an elderly person with knee pain pray sitting down?
  - id: "3951"
    formal: هل يجوز للمريض أن يقدم الصلاة قبل دخول العملية الجراحية؟
    colloquial: عندي عملية والتخدير بيطول، أصلي قبل وقتها؟
    short: الصلاة قبل العملية؟
    different: من سيغيب عن وعيه بسبب التخدير ساعات، كيف يرتب صلواته؟

  # ── قضاء الصيام ──
  - id: "1354"
    also: ["4645"]
    formal: هل يجب التتابع في قضاء أيام رمضان؟
    colloquial: علي أيام من رمضان، أقضيها ورا بعض ولا متفرقة عادي؟
    short: التتابع في القضاء؟
    different: قضاء ما فات من الصوم، هل يلزم وصله أم يجوز تفريقه؟
    typo: لازم اقضي رمضان متتابع
    english: Do missed Ramadan days have to be made up consecutively?
  - id: "1621"
    formal: هل يجوز قضاء أيام رمضان يوم الجمعة فقط؟
    colloquial: أبي أقضي اللي علي من رمضان بس أيام الجمعة لأني فاضي، يصير؟
    short: القضاء يوم الجمعة؟
    different: تخصيص الجمعة لصوم الأيام الفائتة من رمضان، هل فيه حرج؟
  - id: "2926"
    also: ["2849"]
    formal: هل يجوز الصيام عن الميت الذي عليه قضاء من رمضان؟
    colloquial: أمي الله يرحمها ماتت وعليها أيام من رمضان، أصوم عنها؟
    short: الصيام عن الميت؟
    different: الأيام التي لم يقضها المتوفى من رمضان، هل يصومها أحد من أهله عنه؟
    english: Can I fast on behalf of my deceased mother who missed Ramadan days?
