# Approved Source Whitelist — owned by the sharia-governance lead.
#
# status:
#   approved → indexed and allowed in retrieval / answers
#   pending  → may be fetched and indexed, but is EXCLUDED from retrieval until approved
#   blocked  → never fetched, never retrieved
#
# priority: when retrieved fatwas of different sources disagree, the answer follows the lower number
#   (1 = highest). Sources without a priority come last.
#
# A source is never considered trustworthy merely because it is well known.
# Every change to this file needs governance review (see CONTRIBUTING.md).

